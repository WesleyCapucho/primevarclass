[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primevarclass"
version = "1.0.0"
description = "Domain-aware, externally validated classifier for BRCA1/BRCA2 missense variants of uncertain significance."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
boosting = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
]
explain = [
  "shap>=0.43",
]
all = [
  "xgboost>=2.0",
  "lightgbm>=4.0",
  "shap>=0.43",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
]

[project.scripts]
primevarclass = "primevarclass.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 (line length) is relaxed: the scientific core modules carry long, readable
# expressions and docstrings; correctness rules (F/W) remain enforced.
ignore = ["E501"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
