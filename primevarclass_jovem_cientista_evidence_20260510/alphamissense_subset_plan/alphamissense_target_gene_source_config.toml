[ingestion]
deduplicate_on = ["gene", "hgvs_p"]
prefer_annotation_values = true

[[sources]]
name = "alphamissense_target_gene_scores"
kind = "annotation"
type = "file"
format = "tsv"
path = "data/raw/alphamissense/target_gene_alphamissense.tsv"
preset = "alphamissense_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["BRCA1", "BRCA2", "TP53", "PTEN", "MSH2", "KRAS", "GCK", "F9"]
release_version = "AlphaMissense_v2023_hg38"
