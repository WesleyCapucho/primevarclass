name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (editable)
        run: pip install -e ".[dev]"
      - name: Core tests (domain annotation + ESM-2 ingestion)
        run: pytest tests/test_domain_annotation.py tests/test_esm_scores.py -q
