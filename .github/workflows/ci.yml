name: PrimeVarClass CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Least-privilege by default (security hardening).
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.4"
      - name: Ruff (correctness + import hygiene)
        run: ruff check src/ tests/ --output-format=github

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package + dev extras
        run: pip install -e ".[explain,dev]"
      - name: Run tests
        run: python -m pytest tests/ -q
        timeout-minutes: 5

  security:
    runs-on: ubuntu-latest
    # Informational: surfaces advisories on our runtime dependencies without
    # blocking the build when an upstream/transitive CVE is published.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pip-audit
      - name: Audit runtime dependencies for known vulnerabilities (CVEs)
        run: pip-audit --skip-editable --progress-spinner off
