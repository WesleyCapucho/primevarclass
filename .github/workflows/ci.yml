name: PrimeVarClass CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff>=0.4
      - name: Run ruff check
        run: ruff check src/ --output-format=github
        continue-on-error: true

  test-core:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[all,dev]"
      - name: Run core ingestion tests
        run: python -m pytest tests/ -k "core" -x --tb=short -q
        timeout-minutes: 5

  test-scientific:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[all,dev]"
      - name: Run scientific module tests
        run: python -m pytest tests/ -k "scientific" -x --tb=short -q
        timeout-minutes: 5

  test-api:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[all,dev]"
      - name: Run API operational tests
        run: python -m pytest tests/ -k "api" -x --tb=short -q
        timeout-minutes: 10

  test-study:
    runs-on: ubuntu-latest
    needs: [test-core, test-scientific]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -e ".[all,dev]"
      - name: Run study benchmark tests
        run: python -m pytest tests/ -k "study or benchmark" -x --tb=short -q
        timeout-minutes: 20

