[ingestion]
deduplicate_on = ["gene", "hgvs_p", "label"]
prefer_annotation_values = true

[[sources]]
name = "clinvar_variant_summary"
kind = "cohort"
type = "file"
format = "tsv"
path = "data/examples/clinvar_variant_summary_like.tsv"
preset = "clinvar_variant_summary"

[[sources]]
name = "gnomad_brca_annotations"
kind = "annotation"
type = "file"
format = "tsv"
path = "data/examples/gnomad_brca_annotations.tsv"
preset = "gnomad_variant_table"
join_on = ["gene", "hgvs_p"]

[[sources]]
name = "mavedb_brca_scores"
kind = "annotation"
type = "file"
format = "csv"
path = "data/examples/mavedb_brca_scores.csv"
preset = "mavedb_score_table"
join_on = ["gene", "hgvs_p"]
