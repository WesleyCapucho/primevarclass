[study]
name = "Public PTEN Benchmark Scaffold"
mode = "hybrid"
high_confidence_only = false
keep_metadata = true
primary_metric = "auc_roc"
baseline_experiment = "external_predictors_only"
n_bootstrap = 100

[[cohorts]]
name = "pten_training"
role = "train"
source_config = "configs/multigene/pten/public_pten_real.toml"

[[cohorts]]
name = "pten_clinical_external_validation"
role = "external_test"
source_config = "configs/multigene/pten/public_pten_external_clinical.toml"

[[cohorts]]
name = "pten_secondary_external_validation"
role = "external_test"
source_config = "configs/multigene/pten/public_pten_external_secondary.toml"
