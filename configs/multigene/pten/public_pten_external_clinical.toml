[ingestion]
deduplicate_on = ["gene", "hgvs_p", "label"]
prefer_annotation_values = true

[[sources]]
name = "pten_clinical_external_validation"
kind = "cohort"
type = "file"
format = "tsv"
path = "data/raw/multigene/pten/pten_clinical_external.tsv"
preset = "clinvar_variant_summary"
gene_allowlist = ["PTEN"]

[[sources]]
name = "pten_validation_gnomad_annotations"
kind = "annotation"
type = "file"
format = "tsv"
path = "data/raw/gnomad/pten_missense_annotations.tsv"
preset = "gnomad_variant_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["PTEN"]

[[sources]]
name = "pten_validation_mavedb_scores"
kind = "annotation"
type = "file"
format = "csv"
path = "data/raw/mavedb/pten_function_scores.csv"
preset = "mavedb_score_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["PTEN"]
