[ingestion]
deduplicate_on = ["gene", "hgvs_p", "label"]
prefer_annotation_values = true

[[sources]]
name = "msh2_secondary_external_validation"
kind = "cohort"
type = "file"
format = "tsv"
path = "data/raw/multigene/msh2/msh2_secondary_external.tsv"
preset = "clinvar_variant_summary"
gene_allowlist = ["MSH2"]

[[sources]]
name = "msh2_validation_gnomad_annotations"
kind = "annotation"
type = "file"
format = "tsv"
path = "data/raw/gnomad/msh2_missense_annotations.tsv"
preset = "gnomad_variant_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["MSH2"]

[[sources]]
name = "msh2_validation_mavedb_scores"
kind = "annotation"
type = "file"
format = "csv"
path = "data/raw/mavedb/msh2_function_scores.csv"
preset = "mavedb_score_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["MSH2"]
