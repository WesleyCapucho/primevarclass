[study]
name = "Public GCK Benchmark Scaffold"
mode = "hybrid"
high_confidence_only = false
keep_metadata = true
primary_metric = "auc_roc"
baseline_experiment = "external_predictors_only"
n_bootstrap = 100

[[cohorts]]
name = "gck_training"
role = "train"
source_config = "configs/multigene/gck/public_gck_real.toml"

[[cohorts]]
name = "gck_clinical_external_validation"
role = "external_test"
source_config = "configs/multigene/gck/public_gck_external_clinical.toml"

[[cohorts]]
name = "gck_secondary_external_validation"
role = "external_test"
source_config = "configs/multigene/gck/public_gck_external_secondary.toml"
