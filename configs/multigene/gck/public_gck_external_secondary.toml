[ingestion]
deduplicate_on = ["gene", "hgvs_p", "label"]
prefer_annotation_values = true

[[sources]]
name = "gck_secondary_external_validation"
kind = "cohort"
type = "file"
format = "tsv"
path = "data/raw/multigene/gck/gck_secondary_external.tsv"
preset = "clinvar_variant_summary"
gene_allowlist = ["GCK"]

[[sources]]
name = "gck_validation_gnomad_annotations"
kind = "annotation"
type = "file"
format = "tsv"
path = "data/raw/gnomad/gck_missense_annotations.tsv"
preset = "gnomad_variant_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["GCK"]

[[sources]]
name = "gck_validation_mavedb_scores"
kind = "annotation"
type = "file"
format = "csv"
path = "data/raw/mavedb/gck_function_scores.csv"
preset = "mavedb_score_table"
join_on = ["gene", "hgvs_p"]
gene_allowlist = ["GCK"]
