[study]
name = "Public KRAS Benchmark Scaffold"
mode = "hybrid"
high_confidence_only = false
keep_metadata = true
primary_metric = "auc_roc"
baseline_experiment = "external_predictors_only"
n_bootstrap = 100

[[cohorts]]
name = "kras_training"
role = "train"
source_config = "configs/multigene/kras/public_kras_real.toml"

[[cohorts]]
name = "kras_clinical_external_validation"
role = "external_test"
source_config = "configs/multigene/kras/public_kras_external_clinical.toml"

[[cohorts]]
name = "kras_secondary_external_validation"
role = "external_test"
source_config = "configs/multigene/kras/public_kras_external_secondary.toml"
