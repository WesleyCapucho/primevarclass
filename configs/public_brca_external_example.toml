[ingestion]
deduplicate_on = ["gene", "hgvs_p", "label"]
prefer_annotation_values = true

[[sources]]
name = "bridges_like_validation"
kind = "cohort"
type = "file"
format = "tsv"
path = "data/examples/bridges_like_brca_test.tsv"
preset = "clinvar_variant_summary"

[[sources]]
name = "gnomad_validation_annotations"
kind = "annotation"
type = "file"
format = "tsv"
path = "data/examples/gnomad_brca_validation.tsv"
preset = "gnomad_variant_table"
join_on = ["gene", "hgvs_p"]

[[sources]]
name = "mavedb_validation_scores"
kind = "annotation"
type = "file"
format = "csv"
path = "data/examples/mavedb_brca_validation.csv"
preset = "mavedb_score_table"
join_on = ["gene", "hgvs_p"]
